name: SmactorIO guardrails

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smactorio-guardrails:
    name: smactorio-guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine changed paths
        id: changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags --prune --depth=1 origin "$BASE_REF"
            base_sha="$(git merge-base HEAD "origin/${BASE_REF}")"
          else
            before="$BEFORE_SHA"
            if [[ -n "$before" && ! "$before" =~ ^0+$ ]] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              base_sha="$before"
            elif git rev-parse HEAD^ >/dev/null 2>&1; then
              base_sha="$(git rev-parse HEAD^)"
            elif git rev-parse --verify "origin/${DEFAULT_BRANCH}" >/dev/null 2>&1; then
              base_sha="$(git merge-base HEAD "origin/${DEFAULT_BRANCH}")"
            else
              base_sha="$(git hash-object -t tree /dev/null)"
            fi
          fi
          echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"
          git diff --name-only --no-renames "$base_sha" HEAD | sort > "$RUNNER_TEMP/changed-paths.txt"
          while IFS= read -r path; do
            printf 'changed: %s\n' "$path"
          done < "$RUNNER_TEMP/changed-paths.txt"

      - name: Prepare protected guardrail scripts
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/guardrails"
          for script in check_path_scope.py scan_for_secrets.py; do
            if [[ "$EVENT_NAME" == "pull_request" ]] && git show "origin/${BASE_REF}:scripts/${script}" > "$RUNNER_TEMP/guardrails/${script}" 2>/dev/null; then
              printf 'using base-branch guardrail script: %s\n' "$script"
            else
              cp "scripts/${script}" "$RUNNER_TEMP/guardrails/${script}"
              printf 'using checked-out guardrail script: %s\n' "$script"
            fi
            chmod 0755 "$RUNNER_TEMP/guardrails/${script}"
          done

      - name: Check whitespace in changed files
        shell: bash
        run: git diff --check "${{ steps.changed.outputs.base_sha }}" HEAD

      - name: Enforce safe changed-path scope
        shell: bash
        run: >-
          python3 "$RUNNER_TEMP/guardrails/check_path_scope.py"
          --from-file "$RUNNER_TEMP/changed-paths.txt"
          --allow-prefix .github/workflows/
          --allow-prefix config/
          --allow-prefix data/
          --allow-prefix docs/
          --allow-prefix infra/
          --allow-prefix public/
          --allow-prefix scripts/
          --allow-prefix tests/
          --allow-prefix .gitignore
          --allow-prefix pages.json
          --allow-prefix pyproject.toml
          --allow-prefix README.md

      - name: Scan safe SmactorIO source paths for secrets
        shell: bash
        run: >-
          python3 "$RUNNER_TEMP/guardrails/scan_for_secrets.py"
          .github/workflows
          config
          data
          docs
          infra
          public
          scripts
          tests
          README.md
          pyproject.toml

      - name: Run SmactorIO unit tests
        shell: bash
        run: python3 -m unittest discover -s tests -q
